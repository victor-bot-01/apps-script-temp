<script>
var ETQ = {
  data:            [],
  pedidos:         [],
  priority:        [],
  activeStatFilter: 'all',
  activeLocFilter:  'all',
  searchTerm:       '',

  init: function() {
    var modal = qs('#etqConfirmModal');
    if (modal && modal.parentNode !== document.body) {
      document.body.appendChild(modal);
    }
    var prioModal = qs('#etqPriorityModal');
    if (prioModal && prioModal.parentNode !== document.body) {
      document.body.appendChild(prioModal);
    }
    var avulsoModal = qs('#etqAvulsoModal');
    if (avulsoModal && avulsoModal.parentNode !== document.body) {
      document.body.appendChild(avulsoModal);
    }
    var copiarMktModal = qs('#etqCopiarMktModal');
    if (copiarMktModal && copiarMktModal.parentNode !== document.body) {
      document.body.appendChild(copiarMktModal);
    }
    ETQ.bindButtons();
    ETQ.load();
  },

  destroy: function() {},

  bindButtons: function() {
    var backBtn      = qs('#page-etiquetas .back-btn');
    var atualizarBtn = qs('#etqAtualizarBtn');
    var limparBtn    = qs('#etqLimparBtn');
    var themeBtn     = qs('#etqThemeBtn');
    var copiarBtn    = qs('#etqCopiarBtn');
    var copiarMktBtn = qs('#etqCopiarMktBtn');
    var prioBtn      = qs('#etqPrioridadeBtn');
    var avulsoBtn    = qs('#etqAvulsoBtn');
    var searchInput  = qs('#etqSearchInput');

    if (backBtn)      backBtn.addEventListener('click', function() { ROUTER.navigate('home'); });
    if (atualizarBtn) atualizarBtn.addEventListener('click', function() { ETQ.load(); });
    if (limparBtn)    limparBtn.addEventListener('click', function() { ETQ.limparTudo(); });
    if (themeBtn)     themeBtn.addEventListener('click', function() { THEME.toggle(); });
    if (copiarBtn)    copiarBtn.addEventListener('click', function() { ETQ.copiarLista(); });
    if (copiarMktBtn) copiarMktBtn.addEventListener('click', function() { ETQ._abrirCopiarMktModal(); });
    if (prioBtn)      prioBtn.addEventListener('click', function() { ETQ.abrirPrioridade(); });
    if (avulsoBtn)    avulsoBtn.addEventListener('click', function() { ETQ.abrirAvulso(); });

    if (searchInput) {
      searchInput.addEventListener('input', function() {
        ETQ.searchTerm = searchInput.value.trim().toLowerCase();
        ETQ.render();
      });
    }

    qsa('.etq-stat-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        ETQ.activeStatFilter = btn.dataset.filter || 'all';
        qsa('.etq-stat-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        ETQ.render();
      });
    });

    qsa('.etq-filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        ETQ.activeLocFilter = btn.getAttribute('data-loc-filter') || 'all';
        qsa('.etq-filter-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        qsa('.etq-pasta-chip').forEach(function(c) { c.classList.remove('active'); });
        ETQ.render();
      });
    });

    var prioSave    = qs('#etqPrioritySave');
    var prioClose   = qs('#etqPriorityClose');
    var prioOverlay = qs('#etqPriorityModal');
    if (prioSave)    prioSave.addEventListener('click', function() { ETQ._savePriority(); });
    if (prioClose)   prioClose.addEventListener('click', function() { ETQ._closePriority(); });
    if (prioOverlay) {
      prioOverlay.addEventListener('click', function(e) {
        if (e.target === prioOverlay) ETQ._closePriority();
      });
    }

    var avulsoClose   = qs('#etqAvulsoClose');
    var avulsoOverlay = qs('#etqAvulsoModal');
    var avulsoSearch  = qs('#etqAvulsoSearch');
    if (avulsoClose)   avulsoClose.addEventListener('click', function() { ETQ._closeAvulso(); });
    if (avulsoOverlay) {
      avulsoOverlay.addEventListener('click', function(e) {
        if (e.target === avulsoOverlay) ETQ._closeAvulso();
      });
    }
    if (avulsoSearch) {
      var avulsoTimer = null;
      avulsoSearch.addEventListener('input', function() {
        clearTimeout(avulsoTimer);
        var val = avulsoSearch.value.trim();
        if (val.length < 2) {
          var results = qs('#etqAvulsoResults');
          if (results) results.innerHTML = '';
          return;
        }
        avulsoTimer = setTimeout(function() { ETQ._buscarAvulsos(val); }, 400);
      });
    }

    // Modal "Copiar por Marketplace"
    var copiarMktSalvar  = qs('#etqCopiarMktSalvar');
    var copiarMktSomente = qs('#etqCopiarMktSomente');
    var copiarMktOverlay = qs('#etqCopiarMktModal');
    if (copiarMktSalvar) {
      copiarMktSalvar.addEventListener('click', function() {
        var overlay = qs('#etqCopiarMktModal');
        if (overlay) overlay.style.display = 'none';
        ETQ.copiarPorMarketplace(true);
      });
    }
    if (copiarMktSomente) {
      copiarMktSomente.addEventListener('click', function() {
        var overlay = qs('#etqCopiarMktModal');
        if (overlay) overlay.style.display = 'none';
        ETQ.copiarPorMarketplace(false);
      });
    }
    if (copiarMktOverlay) {
      copiarMktOverlay.addEventListener('click', function(e) {
        if (e.target === copiarMktOverlay) copiarMktOverlay.style.display = 'none';
      });
    }
  },

  load: function() {
    var loading = qs('#etqLoading');
    var list    = qs('#etqList');
    var empty   = qs('#etqEmpty');
    if (loading) loading.style.display = 'flex';
    if (list)    list.innerHTML = '';
    if (empty)   empty.style.display = 'none';

    google.script.run
      .withSuccessHandler(function(data) {
        if (loading) loading.style.display = 'none';
        ETQ.data     = (data && data.items)    || [];
        ETQ.pedidos  = (data && data.pedidos)  || [];
        ETQ.priority = (data && data.priority) || [];
        ETQ.render();
      })
      .withFailureHandler(function(err) {
        if (loading) loading.style.display = 'none';
        toast('Erro ao carregar: ' + (err.message || err), 'err');
      })
      .getEtiquetasDoDia();
  },

  getLocPriority: function(item) {
    var pasta = item.locais.filter(function(l) { return l.caixa.toLowerCase().indexOf('pasta') === 0; });
    var caixa = item.locais.filter(function(l) { return l.caixa.toLowerCase().indexOf('caixa') === 0; });
    if (pasta.length) return { type: 0, name: pasta[0].caixa };
    if (caixa.length) return { type: 1, name: caixa[0].caixa };
    return { type: 2, name: '' };
  },

  matchesLocFilter: function(item) {
    var f = ETQ.activeLocFilter;
    if (f === 'all') return true;
    if (f === 'nao-localizado') return item.locais.length === 0;
    if (f.indexOf('pasta:') === 0) {
      var pastaName = f.slice(6);
      return item.locais.some(function(l) { return l.caixa === pastaName; });
    }
    if (f === 'pasta') return item.locais.some(function(l) { return l.caixa.toLowerCase().indexOf('pasta') === 0; });
    if (f === 'caixa') return item.locais.some(function(l) { return l.caixa.toLowerCase().indexOf('caixa') === 0; });
    return true;
  },

  matchesStatFilter: function(item) {
    var f = ETQ.activeStatFilter;
    if (f === 'all') return true;
    if (f === 'nao-marcados')   return item.qtdEncontrada === 0 && !item.naoEncontrado;
    if (f === 'nao-encontrados') return item.naoEncontrado;
    if (f === 'encontrados')    return item.encontrado;
    return true;
  },

  matchesSearch: function(item) {
    if (!ETQ.searchTerm) return true;
    return item.produto.toLowerCase().indexOf(ETQ.searchTerm) !== -1;
  },

  renderPastasVisor: function() {
    var visor = qs('#etqPastasVisor');
    var vazio = qs('#etqPastasVazio');
    if (!visor) return;

    var pastasSet = {};
    ETQ.data.forEach(function(item) {
      if (item.encontrado || item.naoEncontrado) return;
      item.locais.forEach(function(l) {
        if (l.caixa.toLowerCase().indexOf('pasta') === 0) pastasSet[l.caixa] = true;
      });
    });

    var pastas = Object.keys(pastasSet).sort(function(a, b) {
      return a.localeCompare(b, 'pt-BR');
    });

    qsa('.etq-pasta-chip', visor).forEach(function(el) { el.parentNode.removeChild(el); });

    if (!pastas.length) {
      if (vazio) { vazio.textContent = 'Nenhuma pasta identificada'; vazio.hidden = false; }
      return;
    }

    if (vazio) vazio.hidden = true;
    var frag = document.createDocumentFragment();
    pastas.forEach(function(p) {
      var chip = document.createElement('button');
      chip.className = 'etq-pasta-chip' + (ETQ.activeLocFilter === 'pasta:' + p ? ' active' : '');
      chip.textContent = p;
      chip.addEventListener('click', function() {
        if (ETQ.activeLocFilter === 'pasta:' + p) {
          ETQ.activeLocFilter = 'all';
          qsa('.etq-filter-btn').forEach(function(b) {
            b.classList.toggle('active', b.getAttribute('data-loc-filter') === 'all');
          });
        } else {
          ETQ.activeLocFilter = 'pasta:' + p;
          qsa('.etq-filter-btn').forEach(function(b) { b.classList.remove('active'); });
        }
        ETQ.render();
      });
      frag.appendChild(chip);
    });
    visor.appendChild(frag);
  },

  render: function() {
    var list  = qs('#etqList');
    var empty = qs('#etqEmpty');
    if (!list) return;
    list.innerHTML = '';

    var filtered = ETQ.data.filter(function(item) {
      return ETQ.matchesStatFilter(item) &&
             ETQ.matchesLocFilter(item) &&
             ETQ.matchesSearch(item);
    });

    ETQ.renderPastasVisor();
    ETQ.updateStats();

    if (!filtered.length) {
      if (empty) empty.style.display = 'flex';
      return;
    }
    if (empty) empty.style.display = 'none';

    var sorted = filtered.slice().sort(function(a, b) {
      var aHandled = a.encontrado || a.naoEncontrado;
      var bHandled = b.encontrado || b.naoEncontrado;
      if (aHandled !== bHandled) return aHandled ? 1 : -1;
      var locA = ETQ.getLocPriority(a);
      var locB = ETQ.getLocPriority(b);
      if (locA.type !== locB.type) return locA.type - locB.type;
      if (locA.name !== locB.name) return locA.name.localeCompare(locB.name, 'pt-BR');
      return a.produto.localeCompare(b.produto, 'pt-BR');
    });

    var frag = document.createDocumentFragment();
    sorted.forEach(function(item) { frag.appendChild(ETQ.buildCard(item)); });
    list.appendChild(frag);
  },

  buildCard: function(item) {
    var card = document.createElement('div');
    var cardClass = 'etq-card';
    if (item.encontrado)    cardClass += ' etq-found';
    if (item.naoEncontrado) cardClass += ' etq-nao-encontrado';
    card.className = cardClass;
    card.dataset.produto = item.produto;

    var blankQtd = item.qtdNecessaria - item.qtdEncontrada - item.qtdNaoEncontrada;
    var locaisHtml = item.locais.length
      ? item.locais.map(function(l) {
          return '<span class="etq-loc-pill">' + escHtml(l.caixa) + '</span>';
        }).join('')
      : '<span class="etq-loc-none">Não localizado no inventário</span>';

    var qtdInfoHtml = '<div class="etq-card-qtd">Necessário: <strong>' + item.qtdNecessaria + '</strong>';
    if (item.qtdEncontrada > 0) {
      qtdInfoHtml += ' · Encontrado: <strong>' + item.qtdEncontrada + '</strong>';
    }
    if (item.qtdNaoEncontrada > 0) {
      qtdInfoHtml += ' · Não enc.: <strong>' + item.qtdNaoEncontrada + '</strong>';
    }
    if (blankQtd > 0 && !item.encontrado) {
      qtdInfoHtml += ' · <span class="etq-faltam">Faltam: ' + blankQtd + '</span>';
    }
    qtdInfoHtml += '</div>';

    var pedirBtnHtml = item.pedidoMais
      ? '<button class="etq-btn etq-btn-pedir" disabled>&#10003; Pedido</button>'
      : '<button class="etq-btn etq-btn-pedir">Pedir Mais</button>';

    var actionsHtml;
    if (item.encontrado) {
      actionsHtml =
        '<div class="etq-encontrar-wrap">' +
          '<span class="etq-check">&#10003; Encontrado</span>' +
          '<button class="etq-btn etq-btn-desfazer">Desfazer</button>' +
        '</div>';
    } else if (item.naoEncontrado) {
      actionsHtml =
        '<div class="etq-encontrar-wrap">' +
          '<span class="etq-check-nao">&#10007; Não Encontrado</span>' +
          '<button class="etq-btn etq-btn-desfazer etq-btn-desfazer-nao">Desfazer</button>' +
        '</div>';
    } else {
      actionsHtml =
        '<div class="etq-encontrar-wrap">' +
          '<button class="etq-btn etq-btn-found">Encontrado</button>' +
          '<input class="etq-qtd-input" type="number" min="1" max="' + item.qtdNecessaria + '" placeholder="Qtd">' +
        '</div>' +
        '<button class="etq-btn etq-btn-nao-found">Não Encontrado</button>';
    }

    card.innerHTML =
      '<div class="etq-card-main">' +
        '<div class="etq-card-info">' +
          '<div class="etq-card-nome">' + escHtml(item.produto) + '</div>' +
          qtdInfoHtml +
          '<div class="etq-card-locais">' + locaisHtml + '</div>' +
        '</div>' +
        '<div class="etq-card-actions">' +
          actionsHtml +
          pedirBtnHtml +
          '<button class="etq-btn etq-btn-inativar">Inativar</button>' +
        '</div>' +
      '</div>' +
      '<div class="etq-card-obs">' +
        '<input class="etq-obs-input" type="text" placeholder="Observação..." value="' + escHtml(item.observacao) + '">' +
      '</div>';

    var foundBtn = card.querySelector('.etq-btn-found');
    if (foundBtn) {
      foundBtn.addEventListener('click', function() {
        var qtdInput = card.querySelector('.etq-qtd-input');
        var raw      = qtdInput ? qtdInput.value.trim() : '';
        var qtdEnc   = raw ? Number(raw) : item.qtdNecessaria;
        if (isNaN(qtdEnc) || qtdEnc <= 0) qtdEnc = item.qtdNecessaria;
        ETQ.marcarEncontrado(item.produto, qtdEnc);
      });
    }

    var naoFoundBtn = card.querySelector('.etq-btn-nao-found');
    if (naoFoundBtn) {
      naoFoundBtn.addEventListener('click', function() { ETQ.marcarNaoEncontrado(item.produto); });
    }

    var desfazerBtn = card.querySelector('.etq-btn-desfazer:not(.etq-btn-desfazer-nao)');
    if (desfazerBtn) {
      desfazerBtn.addEventListener('click', function() { ETQ.desfazer(item.produto); });
    }

    var desfazerNaoBtn = card.querySelector('.etq-btn-desfazer-nao');
    if (desfazerNaoBtn) {
      desfazerNaoBtn.addEventListener('click', function() { ETQ.desfazerNaoEncontrado(item.produto); });
    }

    var inativarBtn = card.querySelector('.etq-btn-inativar');
    if (inativarBtn) {
      inativarBtn.addEventListener('click', function() { ETQ.inativar(item.produto, item.locais); });
    }

    var pedirBtn = card.querySelector('.etq-btn-pedir');
    if (pedirBtn && !item.pedidoMais) {
      pedirBtn.addEventListener('click', function() { ETQ.pedirMais(item, pedirBtn); });
    }

    var obsInput = card.querySelector('.etq-obs-input');
    if (obsInput) {
      obsInput.addEventListener('blur', function() { ETQ.salvarObs(item.produto, obsInput.value); });
    }

    return card;
  },

  _updateItemEstado: function(produto) {
    var orders = ETQ.pedidos.filter(function(p) { return p.produto === produto; });
    var qtdTotal       = orders.reduce(function(s, p) { return s + p.qtd; }, 0);
    var qtdEncontrada  = orders.reduce(function(s, p) { return s + (p.status === 'Encontrado' ? p.qtd : 0); }, 0);
    var qtdNaoEnc      = orders.reduce(function(s, p) { return s + (p.status === 'Não Encontrado' ? p.qtd : 0); }, 0);
    var encontrado     = qtdTotal > 0 && qtdEncontrada >= qtdTotal;
    var naoEncontrado  = !encontrado && qtdTotal > 0 && (qtdEncontrada + qtdNaoEnc) >= qtdTotal;

    ETQ.data.forEach(function(item) {
      if (item.produto === produto) {
        item.qtdEncontrada   = qtdEncontrada;
        item.qtdNaoEncontrada = qtdNaoEnc;
        item.encontrado      = encontrado;
        item.naoEncontrado   = naoEncontrado;
      }
    });
  },

  marcarEncontrado: function(produto, qtdEncontrada) {
    var blankOrders = ETQ.pedidos.filter(function(p) {
      return p.produto === produto && (!p.status || p.status === '');
    });

    if (!blankOrders.length) { toast('Nenhum pedido pendente', 'err'); return; }

    blankOrders.sort(function(a, b) {
      var ia = ETQ.priority.indexOf(a.marketplace);
      var ib = ETQ.priority.indexOf(b.marketplace);
      if (ia === -1) ia = 9999;
      if (ib === -1) ib = 9999;
      return ia - ib;
    });

    var remaining = qtdEncontrada;
    var discordIds = [];
    blankOrders.forEach(function(order) {
      if (remaining <= 0) return;
      if (remaining < order.qtd) return;
      discordIds.push(order.discordId);
      remaining -= order.qtd;
    });

    if (!discordIds.length) { toast('Quantidade insuficiente para marcar ao menos 1 pedido completo', 'err'); return; }

    discordIds.forEach(function(id) {
      ETQ.pedidos.forEach(function(p) {
        if (p.discordId === id) p.status = 'Encontrado';
      });
    });

    ETQ._updateItemEstado(produto);
    ETQ.render();

    google.script.run
      .withFailureHandler(function(err) { toast('Erro ao salvar: ' + (err.message || err), 'err'); })
      .salvarStatusPedidos(discordIds, 'Encontrado');

    toast('Marcado como encontrado', 'ok');
  },

  marcarNaoEncontrado: function(produto) {
    var blankOrders = ETQ.pedidos.filter(function(p) {
      return p.produto === produto && (!p.status || p.status === '');
    });

    if (!blankOrders.length) { toast('Nenhum pedido pendente', 'err'); return; }

    var discordIds = blankOrders.map(function(p) { return p.discordId; });

    discordIds.forEach(function(id) {
      ETQ.pedidos.forEach(function(p) {
        if (p.discordId === id) p.status = 'Não Encontrado';
      });
    });

    ETQ._updateItemEstado(produto);
    ETQ.render();

    google.script.run
      .withFailureHandler(function(err) { toast('Erro ao salvar: ' + (err.message || err), 'err'); })
      .salvarStatusPedidos(discordIds, 'Não Encontrado');

    toast('Marcado como não encontrado', 'ok');
  },

  desfazer: function(produto) {
    var foundOrders = ETQ.pedidos.filter(function(p) {
      return p.produto === produto && p.status === 'Encontrado';
    });

    if (!foundOrders.length) return;
    var discordIds = foundOrders.map(function(p) { return p.discordId; });

    discordIds.forEach(function(id) {
      ETQ.pedidos.forEach(function(p) {
        if (p.discordId === id) p.status = '';
      });
    });

    ETQ._updateItemEstado(produto);
    ETQ.render();

    google.script.run
      .withFailureHandler(function(err) { toast('Erro ao desfazer: ' + (err.message || err), 'err'); })
      .salvarStatusPedidos(discordIds, '');

    toast('Desmarcado', 'ok');
  },

  desfazerNaoEncontrado: function(produto) {
    var naoFoundOrders = ETQ.pedidos.filter(function(p) {
      return p.produto === produto && p.status === 'Não Encontrado';
    });

    if (!naoFoundOrders.length) return;
    var discordIds = naoFoundOrders.map(function(p) { return p.discordId; });

    discordIds.forEach(function(id) {
      ETQ.pedidos.forEach(function(p) {
        if (p.discordId === id) p.status = '';
      });
    });

    ETQ._updateItemEstado(produto);
    ETQ.render();

    google.script.run
      .withFailureHandler(function(err) { toast('Erro ao desfazer: ' + (err.message || err), 'err'); })
      .salvarStatusPedidos(discordIds, '');

    toast('Desmarcado', 'ok');
  },

  inativar: function(produto, locais) {
    if (!locais || !locais.length) { toast('Produto não encontrado no inventário', 'err'); return; }
    var caixa = locais[0].caixa;
    google.script.run
      .withSuccessHandler(function() { toast(produto + ' inativado', 'ok'); })
      .withFailureHandler(function(err) { toast('Erro: ' + (err.message || err), 'err'); })
      .setProductStatus(produto, caixa, false);
  },

  pedirMais: function(item, btn) {
    btn.disabled    = true;
    btn.textContent = '✓ Pedido';
    var locPriority = ETQ.getLocPriority(item);
    var local       = locPriority.name || '';
    ETQ.data.forEach(function(d) { if (d.produto === item.produto) d.pedidoMais = true; });
    google.script.run
      .withSuccessHandler(function() { toast('Adicionado a Pedidos de Produção', 'ok'); })
      .withFailureHandler(function(err) {
        btn.disabled    = false;
        btn.textContent = 'Pedir Mais';
        ETQ.data.forEach(function(d) { if (d.produto === item.produto) d.pedidoMais = false; });
        toast('Erro ao pedir: ' + (err.message || err), 'err');
      })
      .pedirMaisEtiqueta(item.produto, item.qtdNecessaria, local);
  },

  salvarObs: function(produto, obs) {
    ETQ.data.forEach(function(item) {
      if (item.produto === produto) item.observacao = obs;
    });
    ETQ.pedidos.forEach(function(p) {
      if (p.produto === produto) p.obs = obs;
    });
    google.script.run
      .withFailureHandler(function() { toast('Erro ao salvar observação', 'err'); })
      .salvarObservacao(produto, obs);
  },

  limparTudo: function() {
    ETQ.etqConfirm('Isso irá apagar todo o progresso de etiquetas e os produtos avulsos. Deseja continuar?', function() {
      google.script.run
        .withSuccessHandler(function() {
          toast('Tudo limpo', 'ok');
          ETQ.load();
        })
        .withFailureHandler(function(err) { toast('Erro: ' + (err.message || err), 'err'); })
        .limparEtiquetasEstado();
    });
  },

  copiarLista: function() {
    var pendentes = ETQ.data.filter(function(i) { return !i.encontrado; });
    if (!pendentes.length) { toast('Nenhum item pendente para copiar', 'err'); return; }
    ETQ._copiarItens(pendentes);
  },

  // ── Copiar por Marketplace ──────────────────────────────────────────────────

  _abrirCopiarMktModal: function() {
    var mktMap = ETQ._buildMktMap();
    if (!Object.keys(mktMap).length) {
      toast('Nenhum item pendente para copiar', 'err');
      return;
    }
    var overlay = qs('#etqCopiarMktModal');
    if (overlay) overlay.style.display = 'flex';
  },

  copiarPorMarketplace: function(salvar) {
    var mktMap = ETQ._buildMktMap();
    if (!Object.keys(mktMap).length) {
      toast('Nenhuma informação de marketplace encontrada', 'err');
      return;
    }

    if (!salvar) {
      ETQ._copiarTexto(ETQ._mktMapToTexto(mktMap));
      toast('Lista por marketplace copiada', 'copy');
      return;
    }

    // Salvar e copiar: servidor computa diff (com acesso à Conferência) e salva snapshot
    google.script.run
      .withSuccessHandler(function(res) {
        var texto;
        if (res.isFirst) {
          texto = ETQ._mktMapToTexto(mktMap);
          toast('Lista por marketplace copiada e salva', 'copy');
        } else {
          texto = res.diffText;
          toast('Diff copiado e histórico atualizado', 'copy');
        }
        ETQ._copiarTexto(texto);
      })
      .withFailureHandler(function(err) {
        toast('Erro: ' + (err.message || err), 'err');
      })
      .salvarECopiarMarketplace(JSON.stringify(mktMap));
  },

  _buildMktMap: function() {
    var pendentesItems = ETQ.data.filter(function(item) {
      return !item.encontrado &&
             ETQ.matchesLocFilter(item) &&
             ETQ.matchesSearch(item);
    });

    var pendentesSet = {};
    pendentesItems.forEach(function(item) { pendentesSet[item.produto] = true; });

    var mktMap = {};
    ETQ.pedidos.forEach(function(p) {
      if (!pendentesSet[p.produto]) return;
      if (p.status === 'Encontrado') return;
      var mkt = p.marketplace || 'Desconhecido';
      if (!mktMap[mkt]) mktMap[mkt] = {};
      mktMap[mkt][p.produto] = (mktMap[mkt][p.produto] || 0) + p.qtd;
    });
    return mktMap;
  },

  _mktMapToTexto: function(mktMap) {
    var lines = [];
    Object.keys(mktMap).sort().forEach(function(mkt) {
      lines.push('📦 ' + mkt);
      var produtos = mktMap[mkt];
      Object.keys(produtos).sort().forEach(function(prod) {
        lines.push(prod + ' \xD7 ' + produtos[prod] + ' un.');
      });
      lines.push('');
    });
    return lines.join('\n').replace(/\n+$/, '');
  },

  _gerarDiffTexto: function(anterior, atual) {
    var adicionados = [];
    var removidos   = [];
    var semAlteracao = [];

    var allMkts = {};
    Object.keys(anterior).forEach(function(m) { allMkts[m] = true; });
    Object.keys(atual).forEach(function(m) { allMkts[m] = true; });

    Object.keys(allMkts).sort().forEach(function(mkt) {
      var ant = anterior[mkt] || {};
      var atu = atual[mkt]    || {};
      var allProds = {};
      Object.keys(ant).forEach(function(p) { allProds[p] = true; });
      Object.keys(atu).forEach(function(p) { allProds[p] = true; });

      var mktAdd = [];
      var mktRem = [];

      Object.keys(allProds).sort().forEach(function(prod) {
        var qAnt = ant[prod] || 0;
        var qAtu = atu[prod] || 0;
        if (qAtu > qAnt) {
          if (qAnt === 0) {
            mktAdd.push('📦 ' + mkt + ' → ' + prod + ' \xD7 ' + qAtu + ' un. (novo)');
          } else {
            mktAdd.push('📦 ' + mkt + ' → ' + prod + ' foi de \xD7 ' + qAnt + ' para \xD7 ' + qAtu);
          }
        } else if (qAtu < qAnt) {
          if (qAtu === 0) {
            mktRem.push('📦 ' + mkt + ' → ' + prod + ' (removido)');
          } else {
            mktRem.push('📦 ' + mkt + ' → ' + prod + ' foi de \xD7 ' + qAnt + ' para \xD7 ' + qAtu);
          }
        }
      });

      if (!mktAdd.length && !mktRem.length) {
        semAlteracao.push(mkt);
      } else {
        adicionados = adicionados.concat(mktAdd);
        removidos   = removidos.concat(mktRem);
      }
    });

    var lines = [];
    if (adicionados.length) {
      lines.push('Adicionados:');
      adicionados.forEach(function(l) { lines.push('• ' + l); });
    }
    if (removidos.length) {
      if (lines.length) lines.push('');
      lines.push('Removidos/Reduzidos:');
      removidos.forEach(function(l) { lines.push('• ' + l); });
    }
    if (semAlteracao.length) {
      if (lines.length) lines.push('');
      lines.push('Sem alteração: ' + semAlteracao.join(', ') + '.');
    }
    if (!lines.length) {
      lines.push('Sem alterações em relação ao último envio.');
    }
    return lines.join('\n');
  },

  _copiarTexto: function(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch(e) { toast('Erro ao copiar', 'err'); }
      document.body.removeChild(ta);
    }
  },

  _copiarItens: function(itens) {
    var titulo = 'Etiquetas do Dia';

    var semObs = itens.filter(function(i) { return !i.observacao; });
    var comObs = itens.filter(function(i) { return  i.observacao; });
    var lines  = [];

    if (semObs.length) {
      lines.push(titulo);
      lines.push('');
      semObs.forEach(function(item) {
        var blankQtd = item.qtdNecessaria - item.qtdEncontrada - item.qtdNaoEncontrada;
        lines.push(item.qtdEncontrada > 0
          ? item.produto + ' — faltam ' + blankQtd + ' un. (encontrado ' + item.qtdEncontrada + ' de ' + item.qtdNecessaria + ')'
          : item.produto + ' — ' + item.qtdNecessaria + ' un.');
      });
    }
    if (comObs.length) {
      if (lines.length) lines.push('');
      if (!semObs.length) { lines.push(titulo); lines.push(''); }
      lines.push('Analisar se essas etiquetas estão válidas para hoje ou vamos descartar');
      lines.push('');
      comObs.forEach(function(item) {
        var blankQtd = item.qtdNecessaria - item.qtdEncontrada - item.qtdNaoEncontrada;
        lines.push(item.qtdEncontrada > 0
          ? item.produto + ' — faltam ' + blankQtd + ' un. (obs: ' + item.observacao + ')'
          : item.produto + ' — ' + item.qtdNecessaria + ' un. (obs: ' + item.observacao + ')');
      });
    }

    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { toast('Lista copiada', 'copy'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); toast('Lista copiada', 'copy'); } catch(e) { toast('Erro ao copiar', 'err'); }
      document.body.removeChild(ta);
    }
  },

  // ── Priority modal ──────────────────────────────────────────────────────────

  abrirPrioridade: function() {
    var overlay = qs('#etqPriorityModal');
    if (!overlay) return;

    var mkts = {};
    ETQ.pedidos.forEach(function(p) { if (p.marketplace) mkts[p.marketplace] = true; });
    var known = Object.keys(mkts);

    var ordered = ETQ.priority.slice();
    known.forEach(function(m) {
      if (ordered.indexOf(m) === -1) ordered.push(m);
    });

    ETQ._currentPriorityList = ordered;
    ETQ._renderPriorityList(ordered);
    overlay.style.display = 'flex';
  },

  _closePriority: function() {
    var overlay = qs('#etqPriorityModal');
    if (overlay) overlay.style.display = 'none';
    ETQ._currentPriorityList = null;
  },

  _renderPriorityList: function(ordered) {
    var listEl = qs('#etqPriorityList');
    if (!listEl) return;
    listEl.innerHTML = '';

    var frag = document.createDocumentFragment();
    ordered.forEach(function(mkt, idx) {
      var item = document.createElement('div');
      item.className = 'etq-priority-item';
      item.innerHTML =
        '<span class="etq-priority-rank">' + (idx + 1) + '</span>' +
        '<span class="etq-priority-name">' + escHtml(mkt) + '</span>' +
        '<div class="etq-priority-btns">' +
          '<button class="etq-priority-btn etq-priority-up" title="Mover para cima" ' + (idx === 0 ? 'disabled' : '') + '>↑</button>' +
          '<button class="etq-priority-btn etq-priority-dn" title="Mover para baixo" ' + (idx === ordered.length - 1 ? 'disabled' : '') + '>↓</button>' +
        '</div>';

      item.querySelector('.etq-priority-up').addEventListener('click', function() {
        if (idx > 0) {
          var tmp = ETQ._currentPriorityList[idx - 1];
          ETQ._currentPriorityList[idx - 1] = ETQ._currentPriorityList[idx];
          ETQ._currentPriorityList[idx] = tmp;
          ETQ._renderPriorityList(ETQ._currentPriorityList);
        }
      });
      item.querySelector('.etq-priority-dn').addEventListener('click', function() {
        if (idx < ETQ._currentPriorityList.length - 1) {
          var tmp = ETQ._currentPriorityList[idx + 1];
          ETQ._currentPriorityList[idx + 1] = ETQ._currentPriorityList[idx];
          ETQ._currentPriorityList[idx] = tmp;
          ETQ._renderPriorityList(ETQ._currentPriorityList);
        }
      });

      frag.appendChild(item);
    });
    listEl.appendChild(frag);
  },

  _savePriority: function() {
    var ordered = ETQ._currentPriorityList || [];
    ETQ.priority = ordered.slice();
    ETQ._closePriority();

    google.script.run
      .withSuccessHandler(function() { toast('Prioridade salva', 'ok'); })
      .withFailureHandler(function(err) { toast('Erro ao salvar prioridade: ' + (err.message || err), 'err'); })
      .salvarMarketplacePriority(ordered);
  },

  // ── Avulso modal ────────────────────────────────────────────────────────────

  abrirAvulso: function() {
    var overlay = qs('#etqAvulsoModal');
    if (!overlay) return;
    var input = qs('#etqAvulsoSearch');
    if (input) input.value = '';
    var results = qs('#etqAvulsoResults');
    if (results) results.innerHTML = '';
    overlay.style.display = 'flex';
    if (input) setTimeout(function() { input.focus(); }, 50);
  },

  _closeAvulso: function() {
    var overlay = qs('#etqAvulsoModal');
    if (overlay) overlay.style.display = 'none';
  },

  _buscarAvulsos: function(termo) {
    var results = qs('#etqAvulsoResults');
    if (!results) return;
    results.innerHTML = '<div class="etq-avulso-loading">Buscando...</div>';

    google.script.run
      .withSuccessHandler(function(data) {
        results.innerHTML = '';
        if (!data || !data.length) {
          results.innerHTML = '<div class="etq-avulso-empty">Nenhum produto encontrado</div>';
          return;
        }
        var frag = document.createDocumentFragment();
        data.forEach(function(item) {
          var row = document.createElement('div');
          row.className = 'etq-avulso-item';
          row.innerHTML =
            '<div class="etq-avulso-item-nome">' + escHtml(item.produto) + '</div>' +
            '<div class="etq-avulso-item-qtd">Qtd: ' + item.qtd + '</div>' +
            '<button class="etq-btn etq-btn-found etq-avulso-add-btn">Adicionar</button>';
          row.querySelector('.etq-avulso-add-btn').addEventListener('click', function() {
            ETQ._adicionarAvulso(item.produto, item.qtd, row);
          });
          frag.appendChild(row);
        });
        results.appendChild(frag);
      })
      .withFailureHandler(function(err) {
        results.innerHTML = '<div class="etq-avulso-empty">Erro ao buscar: ' + escHtml(String(err.message || err)) + '</div>';
      })
      .buscarProdutosAvulsos(termo);
  },

  _adicionarAvulso: function(produto, qtd, rowEl) {
    var btn = rowEl ? rowEl.querySelector('.etq-avulso-add-btn') : null;
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.jaExiste) {
          toast('Produto já adicionado — clique em Atualizar para recarregar', 'err');
          if (btn) { btn.disabled = false; btn.textContent = 'Adicionar'; }
        } else {
          toast(produto + ' adicionado. Clique em Atualizar.', 'ok');
          if (btn) { btn.disabled = true; btn.textContent = '✓ Adicionado'; }
        }
      })
      .withFailureHandler(function(err) {
        toast('Erro ao adicionar: ' + (err.message || err), 'err');
        if (btn) { btn.disabled = false; btn.textContent = 'Adicionar'; }
      })
      .adicionarAvulso(produto, qtd);
  },

  // ── Modal helpers ──────────────────────────────────────────────────────────

  etqModal: function(msg, okLabel, onOk, cancelLabel, onCancel) {
    var modal     = qs('#etqConfirmModal');
    var msgEl     = qs('#etqModalMsg');
    var okBtn     = qs('#etqModalOk');
    var cancelBtn = qs('#etqModalCancel');
    if (!modal) { if (onOk) onOk(); return; }
    if (msgEl)     msgEl.textContent     = msg;
    if (okBtn)     okBtn.textContent     = okLabel     || 'Confirmar';
    if (cancelBtn) cancelBtn.textContent = cancelLabel || 'Cancelar';
    modal.style.display = 'flex';

    function close() {
      modal.style.display = 'none';
      if (okBtn)     okBtn.onclick     = null;
      if (cancelBtn) cancelBtn.onclick = null;
      modal.onclick = null;
    }
    if (okBtn)     okBtn.onclick     = function() { close(); if (onOk)     onOk();     };
    if (cancelBtn) cancelBtn.onclick = function() { close(); if (onCancel) onCancel(); };
    modal.onclick = function(e) { if (e.target === modal) close(); };
  },

  etqConfirm: function(msg, onOk) {
    ETQ.etqModal(msg, 'Confirmar', onOk, 'Cancelar', null);
  },

  updateStats: function() {
    var total      = ETQ.data.length;
    var found      = ETQ.data.filter(function(i) { return i.encontrado; }).length;
    var naoEnc     = ETQ.data.filter(function(i) { return i.naoEncontrado; }).length;
    var unmarked   = ETQ.data.filter(function(i) { return i.qtdEncontrada === 0 && !i.naoEncontrado; }).length;
    var t = qs('#etqTotalCount'), u = qs('#etqUnmarkedCount'),
        n = qs('#etqNaoEncCount'), f = qs('#etqFoundCount');
    if (t) t.textContent = total;
    if (u) u.textContent = unmarked;
    if (n) n.textContent = naoEnc;
    if (f) f.textContent = found;
  }
};

if (typeof PAGES === 'undefined') var PAGES = {};
PAGES['etiquetas'] = ETQ;
</script>
